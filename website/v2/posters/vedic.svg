<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#140a3a"/><stop offset=".45" stop-color="#5a1e8c"/><stop offset=".75" stop-color="#d1408e"/><stop offset="1" stop-color="#ff9e6b"/></linearGradient>
<radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffe08a"/><stop offset=".55" stop-color="#ff9e6b" stop-opacity=".5"/><stop offset="1" stop-color="#ff9e6b" stop-opacity="0"/></radialGradient>
<linearGradient id="pet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd0e6"/><stop offset="1" stop-color="#e2569a"/></linearGradient>
<linearGradient id="pet2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe6f1"/><stop offset="1" stop-color="#f07ab2"/></linearGradient>
<linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a1466"/><stop offset="1" stop-color="#12062a"/></linearGradient>
