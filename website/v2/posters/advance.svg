<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#03201e"/><stop offset=".5" stop-color="#0b5a52"/><stop offset=".8" stop-color="#1fa489"/><stop offset="1" stop-color="#9df0c8"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#b8ffe0" stop-opacity=".7"/><stop offset="1" stop-color="#b8ffe0" stop-opacity="0"/></radialGradient>
<linearGradient id="curve" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#ff6aa8"/></linearGradient>
<linearGradient id="sph" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8fff6"/><stop offset="1" stop-color="#1fa489"/></linearGradient>
</defs>
<rect width="900" height="1200" fill="url(#sky)"/>
<circle cx="450" cy="560" r="380" fill="url(#glow)"/>
<!-- perspective grid floor -->
<g stroke="#b8ffe0" stroke-opacity=".35" stroke-width="2">
<path d="M0 860h900M0 920h900M0 1000h900M0 1100h900"/>
<path d="M450 800L-300 1200M450 800L0 1200M450 800L250 1200M450 800L450 1200M450 800L650 1200M450 800L900 1200M450 800L1200 1200"/>
</g>
<!-- axes and curve -->
<g fill="none" stroke-linecap="round">
<path d="M150 760V230M150 760h620" stroke="#e8fff6" stroke-width="6"/>
<path d="M140 250l10-24 10 24M750 750l24 10-24 10" stroke="#e8fff6" stroke-width="6"/>
<path d="M170 720C260 720 290 360 380 360S500 640 560 640 660 300 760 280" stroke="url(#curve)" stroke-width="12"/>
<path d="M170 720C260 720 290 360 380 360S500 640 560 640 660 300 760 280V760H170z" fill="url(#curve)" fill-opacity=".14" stroke="none"/>
</g>
<g fill="#ffe08a"><circle cx="380" cy="360" r="12"/><circle cx="560" cy="640" r="12"/></g>
<path d="M380 360h120" stroke="#ffe08a" stroke-width="3" stroke-dasharray="8 8"/>
<!-- integral -->
<text x="110" y="200" font-family="Georgia,serif" font-style="italic" font-size="200" fill="#e8fff6" opacity=".9">∫</text>
<text x="200" y="170" font-family="Georgia,serif" font-style="italic" font-size="54" fill="#ffe08a">eˣ dx</text>
<!-- sphere & cone wireframe -->
<g transform="translate(720 980)"><circle r="110" fill="url(#sph)" opacity=".9"/><ellipse rx="110" ry="34" fill="none" stroke="#03201e" stroke-opacity=".4" stroke-width="3"/><ellipse rx="40" ry="110" fill="none" stroke="#03201e" stroke-opacity=".4" stroke-width="3"/></g>
<g transform="translate(180 1060)" fill="none" stroke="#ffe08a" stroke-width="5"><path d="M0-200L-90 0M0-200L90 0"/><ellipse rx="90" ry="26"/></g>
<g font-family="Georgia,serif" font-style="italic" fill="#e8fff6" opacity=".85"><text x="600" y="150" font-size="56">lim</text><text x="610" y="190" font-size="26">x→0</text><text x="700" y="180" font-size="56">sin x/x</text></g>
<g fill="#e8fff6"><circle cx="830" cy="420" r="4"/><circle cx="60" cy="460" r="3"/><circle cx="470" cy="110" r="4"/></g>
</svg>
