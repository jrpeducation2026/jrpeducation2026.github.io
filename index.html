<script>
// Always show the phone layout. If Chrome's "Desktop site" is on, a phone gets a ~980px wide page;
// scale it back up so the app looks the same as normal mobile view.
(function () {
  function fit() {
    var de = document.documentElement, sw = Math.min(screen.width, screen.height);
    de.style.zoom = "";
    var touch = window.matchMedia && matchMedia("(pointer: coarse)").matches;
    var iw = window.innerWidth;
    if (touch && sw && iw >= 800 && iw > sw * 1.5) de.style.zoom = (iw / sw).toFixed(3);
  }
  fit();
  window.addEventListener("resize", function () { clearTimeout(window.__fitT); window.__fitT = setTimeout(fit, 150); });
})();
</script>

<button class="install" id="installBtn" hidden>Install app</button>
<div class="iostip" id="iosTip" hidden><p><b>Install on iPhone:</b> tap <span class="sh">Share ⬆</span> below, then <b>Add to Home Screen</b>.</p><button id="iosX" aria-label="Close">✕</button></div>
<div class="toast" id="toast" hidden></div>
<script type="module" src="app.js?v=1792846105"></script>
<script>
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}
let deferredInstall=null;const ib=document.getElementById("installBtn");
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e;if(!matchMedia("(display-mode: standalone)").matches)ib.hidden=false;});
ib.onclick=async()=>{if(!deferredInstall)return;deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;ib.hidden=true;};
window.addEventListener("appinstalled",()=>{ib.hidden=true;});
// iPhone/iPad: Safari has no install prompt, so show how to add it to the home screen
(function(){var ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
var standalone=window.navigator.standalone||matchMedia("(display-mode: standalone)").matches;var seen=false;try{seen=localStorage.getItem("jrp-ios-tip")==="1";}catch(e){}
if(ios&&!standalone&&!seen){var t=document.getElementById("iosTip");t.hidden=false;document.getElementById("iosX").onclick=function(){t.hidden=true;try{localStorage.setItem("jrp-ios-tip","1");}catch(e){}};}})();
</script>
